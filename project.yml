name: SheepChase
options:
  bundleIdPrefix: local.sheepchase
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SheepChaseCore:
    path: Packages/SheepChaseCore
  SheepChasePersistence:
    path: Packages/SheepChasePersistence
  SheepChaseUI:
    path: Packages/SheepChaseUI
  SheepChaseExport:
    path: Packages/SheepChaseExport
  SheepChaseBattleEngine:
    path: Packages/SheepChaseBattleEngine

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_SWIFT_FLAGS: "$(inherited) -disable-sandbox"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  SheepChaseMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SheepChase
        excludes:
          - Resources/**
      - path: SheepChase/Resources
        buildPhase: resources
    dependencies:
      - package: SheepChaseCore
      - package: SheepChasePersistence
      - package: SheepChaseUI
      - package: SheepChaseExport
      - package: SheepChaseBattleEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sheepchase.mac
        PRODUCT_NAME: SheepChase
        INFOPLIST_KEY_CFBundleDisplayName: 荒野逐羊
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - SheepChaseTests

  SheepChasePad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SheepChase
        excludes:
          - Resources/**
      - path: SheepChase/Resources
        buildPhase: resources
    dependencies:
      - package: SheepChaseCore
      - package: SheepChasePersistence
      - package: SheepChaseUI
      - package: SheepChaseExport
      - package: SheepChaseBattleEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sheepchase.ipad
        PRODUCT_NAME: SheepChase
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_CFBundleDisplayName: 荒野逐羊
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      testTargets:
        - SheepChaseUITests

  SheepChaseTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SheepChaseTests
    dependencies:
      - target: SheepChaseMac
      - package: SheepChaseCore
      - package: SheepChasePersistence
      - package: SheepChaseExport
      - package: SheepChaseBattleEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sheepchase.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "$(inherited) -disable-sandbox"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SheepChase.app/Contents/MacOS/SheepChase"
        BUNDLE_LOADER: "$(TEST_HOST)"
    scheme:
      testTargets: []

  SheepChaseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SheepChaseUITests
    dependencies:
      - target: SheepChasePad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.sheepchase.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "$(inherited) -disable-sandbox"
        TEST_TARGET_NAME: SheepChasePad
        TARGETED_DEVICE_FAMILY: "2"
    scheme:
      testTargets: []
