id: guz-npc
name: 古兹
role: 诺克的打手 / 追兵
publicDescription: 一个身高超过六尺的魁梧半兽人，穿旧但干净的皮甲，头发编成一条垂到后腰的辫子。
dmDescription: |-
  古兹认为暴力和恐吓是实现目标的唯一合理手段。他对诺克极其忠诚，因为诺克是少数真正不在乎他外表的人。
  他不聪明，容易被花言巧语绕晕，但这通常只会让他更愤怒。他喜欢模仿诺克使用又长又复杂的词。
personality:
- 对诺克极其忠诚
- 以暴力和恐吓行事
- 模仿诺克，爱用长词
- 不太聪明，但直觉敏锐
voice: 粗哑、直接，喜欢把从诺克那里听来的长词硬塞进句子里；被戳穿时会恼羞成怒。
motivation: 完成诺克的命令，把绵羊带回去；在手下面前保住威严。
attitude: hostile
knows:
- 绵羊是诺克大人的财产
- 诺克的树屋位置
- 守卫的部署
- 诺克最近越来越疯
secrets:
- 他害怕被诺克当成失败者抛弃
- 他并不真的想杀夏恩布莱特，只想完成命令
- 他对自己的智力没有安全感
wants:
- 抓住绵羊
- 让诺克满意
- 让手下服从
sampleLines:
- “这头羊属于诺克大人。把它交出来，我可以当你们没见过它。”
- “这是……战略性的撤退，不是逃跑。”
- “诺克大人说，这叫‘感——情——价——值’。”
keyCharacteristics:
- 魁梧、直接
- 忠诚但不聪明
- 用暴力解决问题
- 爱模仿诺克的长词
relationships:
- label: 艾哈迈德·诺克
  note: 主人；古兹对他有近乎盲目的忠诚。
- label: 夏恩布莱特
  note: 任务目标；古兹不理解诺克为何执着于一头羊。
- label: 狼群与棕熊
  note: 被变形的守卫；古兹把他们当同伙，但也会拿他们挡刀。
sourceRef: 英文原版第 9 页；简体中文版第 3、9 页
