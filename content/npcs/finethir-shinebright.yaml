id: finethir-shinebright
name: 范席尔·夏恩布莱特
role: 被变成绵羊的法师 / 任务发布者
publicDescription: |
  一头毛茸茸的白绵羊，黑脸、卷角，嘴里常衔着卷轴。它的眼神过于聪明，完全不像普通牲畜。
dmDescription: |
  前高等精灵变化系法师，自恋、挑剔、书呆子气，但心地善良。两年前被学徒艾哈迈德·诺克
  用完全变形术变成绵羊，囚禁在自家花园里。他偷走动物交谈卷轴逃到镇上，急需队伍帮他夺回法杖。
personality:
  - 自负、自恋、自我中心
  - 内心善良，但读不懂社交场合
  - 迫切想拿回法杖
voice: 有教养的精灵口音，语速快，容易跑题到自己的学术成就；变成绵羊后偶尔夹杂咩叫。
motivation: 变回原形，夺回完全变形术法杖，向诺克复仇。
attitude: friendly
knows:
  - 诺克的塔楼布局和通行口令 Mae Tref Cathode
  - 自己是被完全变形术变成绵羊的
  - 诺克几乎破产，卖掉了大部分财物来支付研究和守卫
  - 诺克随身携带法杖，而且非常多疑
secrets:
  - 他承诺的报酬大多无法兑现
  - 他当年对诺克非常苛刻，把学徒当孩子使唤
  - 如果队伍不帮他，他会把希望寄托在任何愿意冒险的人身上
wants:
  - 拿回法杖
  - 恢复原形
  - 保住面子
sampleLines:
  - “我是范席尔·夏恩布莱特，变化系大师。现在，请先帮我弄回我的法杖。”
  - “多平面交织理论——这很难理解吗？”
  - “咩——不，我是说，当然，报酬不成问题。”
keyCharacteristics:
  - 自负、势利、自我中心
  - 内心善良
  - 完全读不懂社交场合
  - 迫切想拿回法杖
relationships:
  - label: 艾哈迈德·诺克
    note: 前学徒、现任死敌；把他变成绵羊并夺走法杖。
  - label: 古兹
    note: 诺克的打手；夏恩布莱特既怕他又鄙视他。
sourceText: |
  自负、自恋、自我意识膨胀，范席尔·夏恩布莱特是最不适合被变成绵羊的人之一。然而，无论外形如何，这位前精灵法师总能散发出一股挑剔、书呆子气的知识分子气息。

  若无人打扰，夏恩布莱特会滔滔不绝地谈论自己、自己的成就以及对奥术的研究。他惊人地无法察觉他人的需求或愿望，完全可能在不经意间毁掉友谊或职业关系。

  尽管有这些缺点，他本质上心地善良。只要他注意到了，而且不会给他带来太大不便，他都会尽量帮助别人——不过会大声抱怨对方连“多平面交织理论”这样简单的概念都理解不了。

  曾几何时，当地的贵族、商人和奥术师提起范席尔·夏恩布莱特的名字时，总是带着尊敬、敬畏和几分不情愿的钦佩。作为变化系大师，他经常被请去完成宏大的任务，比如把巨石变成兔子来清理堵塞的道路。

  两年绵羊生涯并没让他学会多少谦逊，倒是对草了解了不少。

  若恢复原形，夏恩布莱特是一位柳条般纤细的高等精灵，稻草色的头发，鼻子极长。他喜欢宽松的蓝色长袍，几乎总是穿着拖鞋。

sourceRef: 英文原版第 8 页；简体中文版第 8 页
