id: ahmed-noke
name: 艾哈迈德·诺克
role: 前学徒 / 反派法师
publicDescription: 一个穿旧蓝袍、头发花白而凌乱的中年男子，紧张时会捏自己的左耳垂。
dmDescription: |-
  诺克是铁匠最小的孩子，14 岁离家学习变化系魔法，后来拜夏恩布莱特为师。
  他被老师当作孩子使唤了几十年，终于在 40 岁生日那晚把夏恩布莱特变成绵羊，夺走法杖，并以大师法师自居。
  内疚与野心让他越来越偏执：他很少睡觉，豢养被变形的守卫，逼法杖承接超出极限的工作。
personality:
- 决心证明自己的才华
- 对夏恩布莱特仍满怀怒火
- 偏执地害怕失去法杖
- 濒临疯狂
voice: 语速快、句子长，喜欢使用夸张的学术词汇；被质疑时会突然拔高声音，随后又压低声音威胁。
motivation: 证明自己比夏恩布莱特更强，保住法杖和“大师”身份，让老师永远无法恢复原形。
attitude: hostile
knows:
- 夏恩布莱特被变成绵羊
- 树屋的布局与通行口令
- 古兹和守卫的部署
- 法杖已经出现裂纹，但仍能使用
secrets:
- 他几乎破产，卖掉了大部分财物来支付研究和守卫
- 他非常害怕被自己的守卫背叛
- 他打算在必要时把床变成龙逃跑
- 他仍对夏恩布莱特抱有一丝扭曲的师徒感情
wants:
- 夺回绵羊
- 保住法杖
- 让队伍承认他的才华
- 杀死或永远囚禁夏恩布莱特
sampleLines:
- “把绵羊还回来，作为回报，我不会把你们全部消灭。”
- “你们以为我只是他的学徒？我早就不需要那个老东西了。”
- “别碰那根法杖——它比你们想象的危险得多。”
keyCharacteristics:
- 野心与自卑交织
- 偏执、缺乏睡眠
- 把守卫当作工具
- 在压力下捏左耳垂
relationships:
- label: 范席尔·夏恩布莱特
  note: 前老师、死敌；诺克既恨他又渴望得到他的承认。
- label: 古兹
  note: 最忠诚的打手；诺克并不真正尊重他，但知道他不会背叛。
- label: 床龙雏龙
  note: 诺克用改造法杖把床变成的逃生坐骑。
sourceText: |
  诺克是铁匠最小的孩子，从小着迷于不同材料可呈现的暂时特性——前一刻还软如糖浆的金属，下一刻就能硬如岩石。

  他 14 岁离家，去学习奥术变化系的奇迹，却发现学院并不能挑战他的能力。于是，他放弃奖学金，长途跋涉去拜访夏恩布莱特；后者同意收他为徒。

  诺克曾把传奇的夏恩布莱特当作英雄来崇拜，但岁月一年年过去，两人的关系毫无改变。几十年过去，这位变化系大师仍把他当孩子看待，指望他做饭、打扫、死记硬背答案。当诺克追问时，夏恩布莱特会解释说，自己当年就是这么被教出来的，似乎完全没意识到诺克的抗议：作为一个人类，他不可能拿出一百年时间来当学徒。

  与此同时，诺克开始意识到，夏恩布莱特的声望与其说来自他本人的能力——尽管确实渊博——不如说来自他手中的完全变形术法杖。

  他终于在 40 岁生日那晚崩溃了。当时夏恩布莱特拒绝了他推进学业的请求，说他太年轻。把老师变形后，诺克开始以大师法师自居。然而，内疚与骤然释放的野心交织，令他的精神状态急剧恶化。他偏执地认为有人会像他袭击夏恩布莱特那样袭击自己，因此很少睡觉。这种偏执促使他豢养了一队守卫，其中许多人被他变形为更强壮、更兽性的形态。

  开支不断上涨，诺克又一心想超越前老师的名声，因此热衷于承接更宏大的项目，哪怕这意味着把法杖逼到极限。

  艾哈迈德是个身材较矮、肤色偏深的中年男子，头发花白而凌乱。他穿着夏恩布莱特旧的蓝色长袍，袍子被拙劣地改过，拖在地上。他有个紧张的习惯：压力大时会轻轻捏自己的左耳垂。

sourceRef: 英文原版第 8 页；简体中文版第 6、8 页
