id: staff-of-true-polymorph
name: 改造过的完全变形术法杖
kind: 法杖（传说）
summary: 一根从橡树上取下的细长枝条，存有 1d4−1 发完全变形术充能（最少 1 发），每日黎明恢复。任何具有施法属性、且与法杖同调 1 小时的人都能使用。每次使用消耗
  1 发充能，并通过 DC 17 智力（奥秘）检定；成功时法术正常施展，且之后使用它的检定 DC 永久 +1。失败不超过 5 点，目标会变成无法行动、1d4 轮后死亡的畸形血肉；失败超过
  5 点，法杖还会爆炸，对 10 尺内每个生物造成剩余充能数 ×1d12 力场伤害，然后被摧毁。
pageRef: 简体中文版第 7 页
sourceRef: 英文原版第 7 页；简体中文版第 7 页
