id: scene-1
order: 1
title: 场景一：坏～～消息
summary: 队伍在午后被一头衔着卷轴的绵羊打断；它其实是法师夏恩布莱特。
readAloud: |
  游戏从队伍消磨一个下午开始。他们也许正在酒馆小酌，在据点休息，或只是无忧无虑地沿街散步。然而无论身在何处，他们很快就会发现有些不对劲。

  一阵杂乱的蹄声、惊叫声和疯狂的咩咩声传来。队伍还没来得及反应，一头绵羊便朝他们奔来。这头野兽看上去与普通绵羊毫无二致——雪白的绒毛、黑色的脸、卷曲的角——但它嘴里衔着一张精致的卷轴。

dmText: |
  游戏从队伍消磨一个下午开始。他们也许正在酒馆小酌，在据点休息，或只是无忧无虑地沿街散步。然而无论身在何处，他们很快就会发现有些不对劲。

  一阵杂乱的蹄声、惊叫声和疯狂的咩咩声传来。队伍还没来得及反应，一头绵羊便朝他们奔来。这头野兽看上去与普通绵羊毫无二致——雪白的绒毛、黑色的脸、卷曲的角——但它嘴里衔着一张精致的卷轴。

  绵羊试图靠近队伍中魔法天赋最高的人，朝对方挥动卷轴；若有人伸手，它便让对方拿走。

  蜡封表明这是一张动物交谈卷轴（修改版）。若某名角色大声说出这一点——比如向其他队员解释——绵羊似乎会热切地点头并咩咩叫。

  若他们使用卷轴（只需念出内容即可启动法术），所有人都会听到绵羊的咩叫瞬间变成有教养的精灵口音通用语，只是仍带着一丝羊叫的尾音。

  确认玩家能听懂后，绵羊自我介绍为范席尔·夏恩布莱特，一名急需帮助的法师。若玩家愿意听，他解释说自己认出他们是冒险者，而自己迫切需要他们的帮助。具体来说，他希望他们从一名危险、可能已经发疯的法师手中夺回一件极其强大的魔法器物。

  他正要讲述自己的故事，但刚开口不久，空中便响起了嚎叫声……

  【夏恩布莱特的故事】

  直到两年前，范席尔·夏恩布莱特还拥有并经营着镇郊的一座塔楼。他是一位颇有天赋的法师，专精变化系魔法。他最珍视的财产——或许也是他成功的关键——是一根极其稀有的完全变形术法杖，他曾用它为当地官员、贵族和商人创造了许多奇迹。

  然而，在一个决定性的夜晚，他从冥想中醒来，发现自己的学徒艾哈迈德·诺克站在身旁，紧握着法杖。夏恩布莱特质问他到底在做什么，但自己能发出的唯一声音只有愤怒的一声“咩——”。一切都已经太迟了。

  法杖是他唯一的得救希望，这位法师因此成了自家花园里的囚徒。他被迫只能吃草和毛茛，而饥饿的狼群和其他野兽——实际上是被变形术变成的守卫——在旁监视。

  昨晚，诺克离家时没有关门，夏恩布莱特数月来第一次看到了希望。他溜了进去，找到一座旧书架，偷走了动物交谈卷轴。随后他咬着卷轴冲进镇里，拼命寻找能启动法术的魔法灵光，终于找到了队伍。

  【疑难解答】

  为什么找我们，而不找当局？ 谁会相信一头绵羊的话，而不信一位受人敬畏的法师？

  动物交谈不是只能持续 10 分钟吗？ 这张卷轴使用的是夏恩布莱特修改过的法术版本，最长可持续八小时。

  你为什么需要法杖？别的法师不能把你变回去吗？ 完全变形术是九环法术。除非冒险所在的城镇拥有一所极负盛名的魔法学院，否则附近极不可能有人能施展它。

beats:
  - id: sheep-arrives
    title: 绵羊冲进来
    type: event
    text: 一头普通模样的绵羊冲向队伍，嘴里衔着卷轴，执意要引起他们的注意。
    readAloud: 蹄声、惊叫和咩咩声由远及近。一头白毛黑脸、卷角的绵羊冲到你们面前。
    npcIds:
      - finethir-shinebright
    handoutIds:
      - scroll-speak-with-animals
  - id: scroll-offered
    title: 卷轴
    type: decision
    text: 绵羊把卷轴递给队伍中最有魔法天赋的人。蜡封显示这是一张动物交谈卷轴（修改版）。
    readAloud: 蜡封上刻着动物与舌头的符文；展开后，文字以精灵语写成。
    handoutIds:
      - scroll-speak-with-animals
    spellIds:
      - speak-with-animals
  - id: shinebright-intro
    title: 绵羊开口
    type: roleplay
    text: 若队伍使用卷轴，绵羊的咩叫会变成有教养的精灵口音通用语；他自称范席尔·夏恩布莱特。
    readAloud: “谢天谢地，终于有人听得懂。我是范席尔·夏恩布莱特，变化系大师。现在，请先帮我弄回我的法杖。”
    npcIds:
      - finethir-shinebright
    spellIds:
      - speak-with-animals
  - id: howling
    title: 嚎叫
    type: transition
    text: 他刚要讲自己的故事，空中响起嚎叫；古兹一伙正在靠近。
    readAloud: 他刚开口，街角便传来一声嚎叫，紧接着是沉重的脚步声和铁器碰撞声。
    encounterIds:
      - guz-ambush
branches:
  - id: if-scroll-used
    label: 若队伍使用卷轴
    requiresFlag: scroll-used
    text: 夏恩布莱特可以正常交谈，并请求队伍帮他夺回法杖；他愿意承诺报酬，但大多无法兑现。
  - id: if-scroll-refused
    label: 若队伍拒绝或无法使用卷轴
    text: 绵羊焦急地原地打转，用蹄子在地上划字；古兹的笑声从街角传来。
  - id: if-attack-sheep
    label: 若队伍直接攻击绵羊
    text: 绵羊惊慌逃窜，试图躲进人群；古兹会把这视为“诺克大人的财产受到威胁”，立即动手。
