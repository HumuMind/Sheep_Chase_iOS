id: scene-2
order: 2
title: 场景二：牧羊人与骗子
summary: 古兹带着三头被变形的狼和一头棕熊上门索要“诺克大人的绵羊”。
readAloud: |
  若队伍在公共场合，一个巨大的半兽人会大摇大摆地朝他们走来，毫不在意地推开人群，身后留下一片愤怒的叫骂。

  若他们在据点或任何私密场所，他便改为猛砸房门。

dmText: |
  若队伍在公共场合，一个巨大的半兽人会大摇大摆地朝他们走来，毫不在意地推开人群，身后留下一片愤怒的叫骂。

  若他们在据点或任何私密场所，他便改为猛砸房门。

  他身边跟着三头戴着项圈的狼（《怪物图鉴》第 341 页），它们的眼神异常聪慧；还有一个披着肮脏棕色斗篷、至少八英尺高的魁梧身影。

  半兽人古兹要求他们把“诺克大人的绵羊”交出来。他说它逃跑了，对他的主人具有极大的“感——情——价——值”。任何提及夏恩布莱特真实身份的话，都只会换来空洞而毫无笑意的笑声。

  古兹不聪明，但他非常忠诚，决心完成任务。无论队伍把夏恩布莱特藏得多好，他的追踪者都知道他在这里，而且他不会接受“不”这个答案。虽然他更倾向于用暴力和恐吓解决问题，但如果看起来更划算，他也愿意行贿并许诺魔法恩惠。

  若他觉得进展不顺，古兹会毫无预警地动手。狼群会跟着他冲上来，而披斗篷的身影会掀开兜帽，露出它其实是一头被变形术变成的棕熊（《怪物图鉴》第 319 页）。

  【古兹】

  护甲等级 14（皮甲） 生命值 67（9d8 + 27） 速度 30 尺

  技能 威吓 +2 感官 被动感知 10 语言 通用语、兽人语 挑战等级 2（450 XP）

  鲁莽。 古兹可以在自己回合内选择让所有近战武器攻击获得优势，但作为交换，直到他下个回合开始前，所有针对他的攻击检定也获得优势。

  回旋巨剑。 近战武器攻击：命中 +5，触及 5 尺，两个目标。命中：10（2d6 + 3）挥砍伤害。

  【战斗策略】

  任何战斗的具体细节都取决于地点。若发生在旅店，桌椅翻倒，满地狼藉；若发生在街上，你可以让惊慌的路人形成困难地形区域。

  所有这些野兽体内都保留着有智慧的人类心智，会聪明地行动。古兹乐于冲上前线，与棕熊并肩对付任何硬骨头。

  与此同时，狼群会试图绕到队伍后方抓走夏恩布莱特（使用矮种马的数据（《怪物图鉴》第 325 页），但智力和感知分别为 18 和 14）。它们想活捉夏恩布莱特，而非杀死他。

  【尘埃落定之后】

  诺克的爪牙被击败、引开或以其他方式解决后，夏恩布莱特会向队伍恳求。没有他们的帮助，他就完了。诺克还有许多守卫仍在为他效力，他们迟早会找到他。

  若队伍流露出雇佣兵式的态度，他会提醒他们：自己的真身是一位强大而富有的法师，并许诺丰厚的报酬。他非常乐意承诺一些他明知自己无法兑现的交易。

  无论如何，要变回原形，夏恩布莱特需要再承受一次完全变形术——这意味着他必须拿回自己的旧法杖。

  这头绵羊解释说，他的前学徒仍住在他的旧宅里，就在镇子东南方。诺克随身携带法杖，除非万不得已绝不离开。夏恩布莱特对旧宅的布局了如指掌（见场景三），并且非常乐意事无巨细地描述。

  若古兹抓住了他，古兹和同伙会动身前往诺克的家。队伍必须决定是否跟上去，这可能会引发一场追逐戏。

beats:
  - id: guz-arrives
    title: 古兹上门
    type: encounter
    text: 古兹要求队伍交出绵羊；他身后的狼群会绕后抓人，棕熊负责堵路。
    readAloud: “这头羊属于诺克大人。把它交出来，我可以当你们没见过它。”
    encounterIds:
      - guz-ambush
branches:
  - id: if-guz-defeated
    label: 若古兹被击败
    requiresFlag: guz-defeated
    text: 夏恩布莱特恳求队伍送他回塔楼夺回法杖；他愿意承诺报酬，但需要被提醒才会兑现。
  - id: if-guz-captured
    label: 若古兹被俘
    requiresFlag: guz-captured
    text: 队伍可以审问古兹，得知诺克仍在塔楼、守卫不多，以及“诺克大人最近越来越疯”。
  - id: if-shinebright-captured
    label: 若夏恩布莱特被俘
    requiresFlag: shinebright-captured
    text: 古兹带着绵羊撤向诺克的树屋；队伍可以追击，或先处理当地当局。
npcIds:
  - finethir-shinebright
encounterIds:
  - guz-ambush
dmNotes: |
  狼群要活捉夏恩布莱特，不杀死他；古兹则乐于把队伍打残。若战斗发生在旅店，
  翻倒的桌椅可以形成困难地形。
sourceRef: 简体中文版第 3 页

fadeToBlack: |
  如果暴力或动物伤害描写过强，可以淡出战斗过程，直接描述古兹一伙被击退/被俘，以及夏恩布莱特恳求队伍送他回树屋。
