dmNotes: 诺克的核心目标是保住法杖和面子。他不会死战；一旦明显不利，就逃向卧室并尝试把床变成龙。守卫降到一半 HP 以下会逃跑。
sourceRef: 英文原版第 4–6 页；简体中文版第 4–6 页
fadeToBlack: 如果床龙、变形或身体恐怖描写过强，可以淡出诺克逃向卧室与床龙破顶的过程，直接描述队伍在屋顶战斗结束后找到损坏的法杖。
