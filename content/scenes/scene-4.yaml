dmNotes: 这幕的重点不是掷骰，而是让队伍决定是否信任夏恩布莱特、是否承担法杖的风险，以及如何处置诺克留下的东西。
sourceRef: 英文原版第 7–9 页；简体中文版第 7–9 页
