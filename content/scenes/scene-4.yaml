branches:
- id: ending-success
  label: 若施法成功
  requiresFlag: shinebright-restored
  text: 夏恩布莱特恢复高等精灵原形，衷心感谢队伍；他付不出大笔金钱，但愿意施展最高五环的变化系法术，并收留被变形的守卫。
- id: ending-failure
  label: 若施法失败
  requiresFlag: shinebright-dead
  text: 夏恩布莱特永久死亡。队伍可以尊重遗愿，把塔楼留给他的旧学院，或搜刮价值约 1,000 gp 的实验设备。
