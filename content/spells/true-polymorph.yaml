id: true-polymorph
name: 完全变形术
aliases:
- True Polymorph
level: 9
school: 变化系
castingTime: 1 动作
range: 30 尺
components: V, S, M
duration: 专注，至多 1 小时
concentration: true
summary: |
  目标变成另一种生物或非魔法物件；生物形态 CR/等级不超过目标，物件变生物 CR 不超过 9 且体型不大于原物件；目标保留 HP、生命骰、阵营和性格，并获得新形态 HP 的临时 HP。维持专注满 1 小时则效果永久。
pageRef: 玩家手册2024 · 法术详述 · 九环
